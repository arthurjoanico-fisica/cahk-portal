const C=window.RADIO_CONFIG,sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_PUBLISHABLE_KEY),$=s=>document.querySelector(s);

let ytApiPromise=null,ytApiReady=false,ytApiRetries=0,directFallback=false,directFallbackStartedAt=0,recoveryAttempts=0,lastProgressAt=Date.now(),lastVideoTime=0,watchdog=null,weakMode=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function setPlayerMessage(text=''){const el=$('#playerMsg');if(el)el.textContent=text}
function networkLooksWeak(){
  const c=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
  if(!c)return false;
  return !!c.saveData||['slow-2g','2g','3g'].includes(c.effectiveType)||((Number(c.downlink)||99)<2.5);
}
function applyWeakMode(on,remember=true){
  weakMode=!!on;
  document.body.classList.toggle('weak-network-mode',weakMode);
  const b=$('#weakMode');
  if(b){
    b.textContent=weakMode?'Conexão fraca: ATIVA':'Conexão fraca: AUTO';
    b.classList.toggle('weak-active',weakMode);
    b.title=weakMode?'Recuperação mais agressiva para internet instável':'Ativar modo para internet instável';
  }
  if(remember){try{localStorage.setItem('radioWeakMode',weakMode?'1':'0')}catch{}}
}
function initWeakMode(){
  let saved=null;try{saved=localStorage.getItem('radioWeakMode')}catch{}
  applyWeakMode(saved==='1'||(saved===null&&networkLooksWeak()),false);
}

function loadYouTubeApi(force=false){
  if(window.YT&&YT.Player){ytApiReady=true;return Promise.resolve(true)}
  if(ytApiPromise&&!force)return ytApiPromise;
  ytApiPromise=new Promise(resolve=>{
    const old=document.getElementById('yt-iframe-api');
    if(force&&old)old.remove();
    const script=document.createElement('script');
    script.id='yt-iframe-api';
    script.async=true;
    script.src='https://www.youtube.com/iframe_api'+(force?'?cahk='+Date.now():'');
    let done=false;
    const finish=(ok)=>{if(done)return;done=true;clearTimeout(timer);resolve(ok)};
    script.onerror=()=>finish(false);
    const timer=setTimeout(()=>finish(!!(window.YT&&YT.Player)),weakMode?6500:10000);
    document.head.appendChild(script);
  }).then(ok=>{
    if(ok||window.YT&&YT.Player){ytApiReady=true;initYouTubePlayer();return true}
    return false;
  });
  return ytApiPromise;
}

function ensurePlayerHost(){
  const area=$('#videoArea');
  let host=document.getElementById('ytplayer');
  if(!host){
    area.innerHTML='<div id="ytplayer"></div>';
    host=document.getElementById('ytplayer');
  }
  return host;
}
function showDirectEmbed(item){
  if(!item?.youtube_id)return;
  directFallback=true;
  directFallbackStartedAt=Date.now();
  yt=null;
  const area=$('#videoArea');
  area.innerHTML=`<iframe id="yt-direct-fallback" title="YouTube — ${esc(item.title||'Rádio CAHK')}" src="https://www.youtube.com/embed/${encodeURIComponent(item.youtube_id)}?autoplay=1&controls=1&rel=0&playsinline=1&origin=${encodeURIComponent(location.origin)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  setPlayerMessage('YouTube em modo compatibilidade por conexão lenta. Tentando recuperar o player automático…');
  scheduleApiRecovery();
}
function scheduleApiRecovery(){
  if(!directFallback||!current?.youtube_id)return;
  setTimeout(async()=>{
    if(!directFallback||currentType!=='video'||!current)return;
    ytApiPromise=null;
    ytApiRetries++;
    const ok=await loadYouTubeApi(true);
    if(ok&&window.YT&&YT.Player&&directFallback){
      const elapsed=Math.max(0,Math.floor((Date.now()-directFallbackStartedAt)/1000)-2);
      directFallback=false;
      const area=$('#videoArea');
      area.innerHTML='<div id="ytplayer"></div>';
      yt=null;
      initYouTubePlayer(elapsed);
      setPlayerMessage('Player automático recuperado.');
      setTimeout(()=>{if(currentType==='video')setPlayerMessage('')},1800);
    }else if(directFallback&&ytApiRetries<6){
      scheduleApiRecovery();
    }else if(directFallback){
      setPlayerMessage('O vídeo abriu em modo compatibilidade. Se não tocar, a rede pode não estar conseguindo acessar o YouTube.');
    }
  },weakMode?12000:20000);
}

function initYouTubePlayer(startSeconds=0){
  if(yt||!window.YT||!YT.Player)return;
  ytApiReady=true;
  ensurePlayerHost();
  try{
    yt=new YT.Player('ytplayer',{
      width:'100%',
      height:'100%',
      host:'https://www.youtube.com',
      playerVars:{
        autoplay:1,
        controls:1,
        rel:0,
        playsinline:1,
        enablejsapi:1,
        origin:location.origin,
        widget_referrer:location.href
      },
      events:{
        onReady:()=>{
          try{
            const frame=yt.getIframe();
            if(frame)frame.referrerPolicy='strict-origin-when-cross-origin';
          }catch{}
          lastProgressAt=Date.now();lastVideoTime=0;
          if(currentType==='video'&&current?.youtube_id){
            try{
              if(startSeconds>0)yt.loadVideoById({videoId:current.youtube_id,startSeconds});
              else yt.loadVideoById(current.youtube_id);
            }catch{}
          }
        },
        onStateChange:e=>{
          if(e.data===YT.PlayerState.ENDED)return finishVideo();
          if(e.data===YT.PlayerState.PLAYING){
            recoveryAttempts=0;lastProgressAt=Date.now();
            try{lastVideoTime=yt.getCurrentTime()||0}catch{}
            setPlayerMessage('');
          }else if(e.data===YT.PlayerState.BUFFERING){
            setPlayerMessage(weakMode?'Conexão fraca: carregando o vídeo…':'Carregando vídeo do YouTube…');
          }
        },
        onError:e=>handleYouTubeError(e.data),
        onAutoplayBlocked:()=>{
          setPlayerMessage('O navegador bloqueou a reprodução automática. Clique em ▶ no player para continuar.');
        }
      }
    });
  }catch{
    yt=null;
  }
}
window.onYouTubeIframeAPIReady=()=>{ytApiReady=true;initYouTubePlayer()};

async function ensureYouTubeFor(item){
  if(!item?.youtube_id)return;
  if(window.YT&&YT.Player){
    if(!yt)initYouTubePlayer();
    if(yt){
      try{yt.loadVideoById(item.youtube_id);return}catch{}
    }
  }
  setPlayerMessage('Conectando ao YouTube…');
  const ok=await loadYouTubeApi();
  if(currentType!=='video'||current?.id!==item.id)return;
  if(ok&&window.YT&&YT.Player){
    if(!yt)initYouTubePlayer();
    try{yt?.loadVideoById(item.youtube_id)}catch{showDirectEmbed(item)}
  }else{
    showDirectEmbed(item);
  }
}

async function recoverPlayback(reason='conexão instável'){
  if(currentType!=='video'||!current?.youtube_id)return;
  recoveryAttempts++;
  const attempt=recoveryAttempts;
  setPlayerMessage(`Conexão instável: recuperando o vídeo (${Math.min(attempt,3)}/3)…`);
  if(attempt<=2&&yt){
    let t=0;try{t=yt.getCurrentTime()||0}catch{}
    try{
      if(attempt===1){yt.seekTo(Math.max(0,t-1),true);yt.playVideo()}
      else yt.loadVideoById({videoId:current.youtube_id,startSeconds:Math.max(0,t-2)})
      lastProgressAt=Date.now();
      return;
    }catch{}
  }
  if(attempt<=3){
    try{yt?.destroy()}catch{}
    yt=null;
    ytApiPromise=null;
    const host=$('#videoArea');host.innerHTML='<div id="ytplayer"></div>';
    const ok=await loadYouTubeApi(true);
    if(ok&&currentType==='video'){initYouTubePlayer(Math.max(0,lastVideoTime-2));return}
  }
  showDirectEmbed(current);
}
async function handleYouTubeError(code){
  if(currentType!=='video'||!current)return;
  const labels={2:'link inválido',5:'falha do player HTML5',100:'vídeo removido ou privado',101:'vídeo bloqueado para incorporação',150:'vídeo bloqueado para incorporação',153:'falha de identificação da origem'};
  if([2,100,101,150].includes(Number(code))){
    setPlayerMessage(`Falha no YouTube (${code}${labels[code]?': '+labels[code]:''}). Pulando automaticamente…`);
    const bad=current;
    try{await fn('queue-admin',{action:'skip',id:bad.id})}catch{}
    current=null;currentType=null;idle=true;
    setTimeout(()=>next(),900);
    return;
  }
  setPlayerMessage(`Falha no YouTube (${code}${labels[code]?': '+labels[code]:''}). Tentando recuperar…`);
  recoverPlayback(labels[code]||'erro do YouTube');
}

function startWatchdog(){
  if(watchdog)return;
  watchdog=setInterval(()=>{
    if(!started||currentType!=='video'||!current||!yt||directFallback)return;
    try{
      const state=yt.getPlayerState();
      const t=Number(yt.getCurrentTime()||0);
      if(t>lastVideoTime+.6){lastVideoTime=t;lastProgressAt=Date.now();return}
      const stalledFor=Date.now()-lastProgressAt;
      const limit=weakMode?18000:28000;
      if((state===YT.PlayerState.BUFFERING||state===YT.PlayerState.PLAYING)&&stalledFor>limit){
        lastProgressAt=Date.now();
        recoverPlayback('travamento por rede lenta');
      }
    }catch{}
  },5000);
}
function token(){return $('#token').value.trim()}async function fn(name,body={}){const r=await fetch(`${C.SUPABASE_URL}/functions/v1/${name}`,{method:'POST',headers:{'Content-Type':'application/json','apikey':C.SUPABASE_PUBLISHABLE_KEY,'x-admin-token':token()},body:JSON.stringify(body)}),j=await r.json();if(!r.ok)throw new Error(j.error||'Erro');return j}async function qload(){const{data}=await sb.from('queue').select('*').eq('status','queued').neq('source','auto').order('position',{ascending:true}).order('created_at',{ascending:true});$('#queue').innerHTML=data?.length?data.map((x,i)=>`<div class="item"><div><strong>${i+1}. ${esc(x.title)}</strong><div class="muted small">${esc(x.channel||'')}</div></div></div>`).join(''):'<div class="muted">Nenhum pedido. A programação automática assume.</div>'}function stopInterstitial(){speechSynthesis.cancel();if(interstitialAudio){interstitialAudio.pause();interstitialAudio.src='';interstitialAudio=null}}function showVideo(item){stopInterstitial();current=item;currentType='video';idle=false;directFallback=false;recoveryAttempts=0;lastProgressAt=Date.now();lastVideoTime=0;$('#videoArea').classList.remove('hidden');$('#announcementArea').classList.add('hidden');$('#sourceBadge').textContent=item.source==='auto'?'PROGRAMAÇÃO AUTOMÁTICA':'PEDIDO';$('#title').textContent=item.title||'Música';$('#channel').textContent=item.channel||'';ensurePlayerHost();ensureYouTubeFor(item)}function chooseVoice(pref){const v=speechSynthesis.getVoices(),pt=v.filter(x=>/^pt(-|_)/i.test(x.lang));return(pref&&v.find(x=>x.name.includes(pref)))||pt.find(x=>/Brazil|Brasil|Google português/i.test(x.name))||pt[0]||v[0]||null}function speak(text,voice){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='pt-BR';u.rate=Number(voice?.rate||1);u.pitch=Number(voice?.pitch||1);const v=chooseVoice(voice?.preferred_voice);if(v)u.voice=v;u.onend=()=>next();u.onerror=()=>setTimeout(next,500);speechSynthesis.speak(u)}function showAnn(item,voice){stopInterstitial();current=item;currentType='announcement';idle=false;$('#videoArea').classList.add('hidden');$('#announcementArea').classList.remove('hidden');$('#interstitialBadge').textContent='RÁDIO CAHK';$('#sourceBadge').textContent=item.type==='product'?'RECADO DO CAHK':item.type==='event'?'AGENDA CAHK':'RÁDIO CAHK';$('#title').textContent=item.title||'Rádio CAHK';$('#channel').textContent='';$('#announcementText').textContent=item.text||'';if(item.audio_url){interstitialAudio=new Audio(item.audio_url);interstitialAudio.onended=()=>next();interstitialAudio.onerror=()=>speak(item.text,voice);interstitialAudio.play().catch(()=>speak(item.text,voice))}else speak(item.text,voice)}function showCommunity(item){stopInterstitial();current=item;currentType='community_audio';idle=false;$('#videoArea').classList.add('hidden');$('#announcementArea').classList.remove('hidden');$('#interstitialBadge').textContent='🎙 ÁUDIO DA GALERA';$('#sourceBadge').textContent='A GALERA TÁ NO AR';$('#title').textContent=`Recado de ${item.display_name||'alguém do CAHK'}`;$('#channel').textContent=`${item.duration_seconds||''}${item.duration_seconds?' segundos':''}`;$('#announcementText').textContent='Recado da comunidade CAHK';interstitialAudio=new Audio(item.audio_url);interstitialAudio.onended=()=>{interstitialAudio=null;next()};interstitialAudio.onerror=()=>{interstitialAudio=null;$('#playerMsg').textContent='Não foi possível tocar este recado.';setTimeout(next,800)};interstitialAudio.play().catch(()=>{interstitialAudio=null;$('#playerMsg').textContent='O navegador bloqueou o áudio. Clique em iniciar novamente.';setTimeout(next,1500)})}
function restoreUnderlyingUI(){
  if(!current||!currentType){
    $('#videoArea').classList.add('hidden');$('#announcementArea').classList.remove('hidden');
    $('#interstitialBadge').textContent='RÁDIO CAHK';$('#sourceBadge').textContent='AGUARDANDO';$('#title').textContent='Preparando programação…';$('#channel').textContent='';$('#announcementText').textContent='';
    return;
  }

    $('#videoArea').classList.remove('hidden');$('#announcementArea').classList.add('hidden');

    $('#title').textContent=current.title||'Música';$('#channel').textContent=current.channel||'';
  }else if(currentType==='announcement'){
    $('#videoArea').classList.add('hidden');$('#announcementArea').classList.remove('hidden');
    $('#interstitialBadge').textContent='RÁDIO CAHK';
    $('#sourceBadge').textContent=current.type==='product'?'RECADO DO CAHK':current.type==='event'?'AGENDA CAHK':'RÁDIO CAHK';
    $('#title').textContent=current.title||'Rádio CAHK';$('#channel').textContent='';$('#announcementText').textContent=current.text||'';
  }else if(currentType==='community_audio'){
    $('#videoArea').classList.add('hidden');$('#announcementArea').classList.remove('hidden');
    $('#interstitialBadge').textContent='🎙 ÁUDIO DA GALERA';$('#sourceBadge').textContent='A GALERA TÁ NO AR';
    $('#title').textContent=`Recado de ${current.display_name||'alguém do CAHK'}`;$('#channel').textContent=`${current.duration_seconds||''}${current.duration_seconds?' segundos':''}`;$('#announcementText').textContent='Recado da comunidade CAHK';
  }

async function checkScheduled(){
  if(!started||scheduledActive||scheduledPending||scheduleCheckLock)return;
  scheduleCheckLock=true;
  try{
    const j=await fn('radio-schedule-check',{action:'check',lookahead_seconds:2});
    if(j.type==='scheduled_audio'&&j.item)prepareScheduled(j.item);
  }catch(e){
    console.warn('Falha ao verificar horário marcado',e);
  }finally{scheduleCheckLock=false}
}
function prepareScheduled(item){
  if(scheduledActive||scheduledPending)return;
  scheduledPending=item;
  scheduledAudio=new Audio(item.audio_url);
  scheduledAudio.preload='auto';
  try{scheduledAudio.load()}catch{}
  const delay=Math.max(0,new Date(item.scheduled_for).getTime()-Date.now());
  scheduledTimer=setTimeout(()=>startScheduled(item),delay);
}
async function startScheduled(item){
  if(!scheduledPending||scheduledPending.id!==item.id)return;
  scheduledPending=null;scheduledActive=true;
  scheduledSnapshot={type:currentType,speechPaused:false};
  if(currentType==='video'&&yt){try{yt.pauseVideo()}catch{}}
  if(interstitialAudio&&!interstitialAudio.paused){try{interstitialAudio.pause()}catch{}}
  if(!interstitialAudio&&speechSynthesis.speaking){try{speechSynthesis.pause();scheduledSnapshot.speechPaused=true}catch{}}
  $('#videoArea').classList.add('hidden');$('#announcementArea').classList.remove('hidden');
  $('#interstitialBadge').textContent='⏰ HORÁRIO MARCADO';$('#sourceBadge').textContent='AGORA';
  $('#title').textContent=item.title||'Áudio agendado';$('#channel').textContent=`Programado para ${new Date(item.scheduled_for).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`;
  $('#announcementText').textContent='Áudio programado pela Rádio CAHK';
  $('#playerMsg').textContent='Reproduzindo no horário agendado.';
  const local=scheduledAudio;
  local.onended=()=>finishScheduled(item);
  local.onerror=async()=>{try{await fn('radio-schedule-check',{action:'release',id:item.id})}catch{};finishScheduled(item,true)};
  try{
    const p=local.play();
    fn('radio-schedule-check',{action:'started',id:item.id}).catch(()=>{});
    await p;
  }catch(e){
    try{await fn('radio-schedule-check',{action:'release',id:item.id})}catch{}
    finishScheduled(item,true);
  }
}
function finishScheduled(item,failed=false){
  if(scheduledAudio){try{scheduledAudio.pause();scheduledAudio.src=''}catch{}scheduledAudio=null}
  scheduledActive=false;scheduledTimer=null;
  restoreUnderlyingUI();
  $('#playerMsg').textContent=failed?'Não foi possível reproduzir o áudio agendado.':'Áudio agendado concluído.';
  const snap=scheduledSnapshot;scheduledSnapshot=null;
  if(currentType==='video'&&current&&yt){try{yt.playVideo()}catch{};setTimeout(()=>{$('#playerMsg').textContent=''},1200);return}
  if(interstitialAudio&&current){interstitialAudio.play().catch(()=>next());setTimeout(()=>{$('#playerMsg').textContent=''},1200);return}
  if(snap?.speechPaused&&speechSynthesis.paused){try{speechSynthesis.resume()}catch{};setTimeout(()=>{$('#playerMsg').textContent=''},1200);return}
  if(current){setTimeout(()=>{$('#playerMsg').textContent=''},1200);return}
  setTimeout(()=>next(),250);
}

async function next(){if(!started||nextLock||scheduledActive||scheduledPending)return;nextLock=true;$('#playerMsg').textContent='Preparando próximo item…';try{const j=await fn('radio-next');if(j.type==='video')showVideo(j.item);else if(j.type==='announcement')showAnn(j.item,j.voice);else if(j.type==='community_audio')showCommunity(j.item);else{idle=true;current=null;currentType=null;$('#title').textContent='Aguardando programação';$('#channel').textContent='';$('#sourceBadge').textContent='EM ESPERA';$('#playerMsg').textContent=j.message||'Sem conteúdo disponível.';setTimeout(()=>{if(started&&idle)next()},15000)}qload();if(j.type!=='idle')$('#playerMsg').textContent=''}catch(e){idle=true;$('#playerMsg').textContent=e.message;setTimeout(()=>{if(started)next()},10000)}finally{nextLock=false}}async function finishVideo(){if(currentType!=='video'||!current)return next();try{await fn('queue-admin',{action:'finish',id:current.id})}catch(e){$('#playerMsg').textContent=e.message}current=null;currentType=null;setTimeout(next,250)}$('#start').onclick=async()=>{if(!token())return $('#startMsg').textContent='Digite o código administrativo.';localStorage.setItem('radioCahkAdmin',token());$('#startMsg').textContent='Validando…';started=true;loadYouTubeApi();try{const j=await fn('radio-next');$('#loginCard').classList.add('hidden');$('#station').classList.remove('hidden');if(j.type==='video')showVideo(j.item);else if(j.type==='announcement')showAnn(j.item,j.voice);else if(j.type==='community_audio')showCommunity(j.item);else{idle=true;$('#playerMsg').textContent=j.message||'';next()}qload()}catch(e){started=false;$('#startMsg').textContent=e.message}};$('#skip').onclick=async()=>{if(scheduledActive||scheduledPending){$('#playerMsg').textContent='Aguarde o áudio agendado.';return}stopInterstitial();if(currentType==='video'&&current){try{await fn('queue-admin',{action:'skip',id:current.id})}catch(e){$('#playerMsg').textContent=e.message}}current=null;currentType=null;next()};$('#ret

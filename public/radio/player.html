<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rádio CAHK — Player</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="https://www.youtube.com/iframe_api"></script></head><body><main class="shell player-shell"><header class="hero"><span class="onair"><span class="dot"></span> RÁDIO CAHK • NO AR</span><h1>PLAYER CENTRAL</h1><p>Deixe esta página aberta no computador conectado à caixa de som.</p></header><section id="loginCard" class="card login-card"><h2>Iniciar estação</h2><div class="stack"><input id="token" type="password" placeholder="Código administrativo"><button class="primary" id="start">INICIAR RÁDIO</button><div class="muted small">O código fica salvo somente neste navegador.</div><div id="startMsg" class="status muted"></div></div></section><div id="station" class="hidden"><div class="player-grid"><section class="card video-card"><div id="videoArea" class="ytwrap"><div id="ytplayer"></div></div><div id="announcementArea" class="announcement-stage hidden"><div><span id="interstitialBadge" class="pill">RÁDIO CAHK</span><h2 id="announcementText"></h2></div></div><div class="player-info"><span id="sourceBadge" class="pill">AGUARDANDO</span><h2 id="title">Preparando programação…</h2><div id="channel" class="muted"></div><div class="controls" style="margin-top:14px"><button class="primary" id="skip">Pular</button><button class="ghost" id="clear">Limpar pedidos</button><button class="ghost" id="admin">Programação</button></div><div id="playerMsg" class="status muted"></div></div></section><aside class="card"><h2>Próximos pedidos</h2><div id="queue"></div></aside></div></div></main><script>
const C=window.RADIO_CONFIG,sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_PUBLISHABLE_KEY),$=s=>document.querySelector(s);let yt=null,started=false,current=null,currentType=null,interstitialAudio=null,idle=true,nextLock=false,scheduledActive=false,scheduledPending=null,scheduledAudio=null,scheduleCheckLock=false,scheduledTimer=null,scheduledSnapshot=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));window.onYouTubeIframeAPIReady=()=>{yt=new YT.Player('ytplayer',{width:'100%',height:'100%',playerVars:{autoplay:1,controls:1,rel:0},events:{onStateChange:e=>{if(e.data===YT.PlayerState.ENDED)finishVideo()}}})};function token(){return $('#token').value.trim()}async function fn(name,body={}){const r=await fetch(`${C.SUPABASE_URL}/functions/v1/${name}`,{method:'POST',headers:{'Content-Type':'application/json','apikey':C.SUPABASE_PUBLISHABLE_KEY,'x-admin-token':token()},body:JSON.stringify(body)}),j=await r.json();if(!r.ok)throw new Error(j.error||'Erro');return j}async function qload(){const{data}=await sb.from('queue').select('*').eq('status','queued').neq('source','auto').order('position',{ascending:true}).order('created_at',{ascending:true});$('#queue').innerHTML=data?.length?data.map((x,i)=>`<div class="item"><div><strong>${i+1}. ${esc(x.title)}</strong><div class="muted small">${esc(x.channel||'')}</div></div></div>`).join(''):'<div class="muted">Nenhum pedido. A programação automática assume.</div>'}function stopInterstitial(){speechSynthesis.cancel();if(interstitialAudio){interstitialAudio.pause();interstitialAudio.src='';interstitialAudio=null}}function showVideo(item){stopInterstitial();current=item;currentType='video';idle=false;$('#videoArea').classList.remove('hidden');$('#announcementArea').classList.add('hidden');$('#sourceBadge').textContent=item.source==='auto'?'PROGRAMAÇÃO AUTOMÁTICA':'PEDIDO';$('#title').textContent=item.title||'Música';$('#channel').textContent=item.channel||'';if(yt&&item.youtube_id)yt.loadVideoById(item.youtube_id)}function chooseVoice(pref){const v=speechSynthesis.getVoices(),pt=v.filter(x=>/^pt(-|_)/i.test(x.lang));return(pref&&v.find(x=>x.name.includes(pref)))||pt.find(x=>/Brazil|Brasil|Google português/i.test(x.name))||pt[0]||v[0]||null}function speak(text,voice){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='pt-BR';u.rate=Number(voice?.rate||1);u.pitch=Number(voice?.pitch||1);const v=chooseVoice(voice?.preferred_voice);if(v)u.voice=v;u.onend=()=>next();u.onerror=()=>setTimeout(next,500);speechSynthesis.speak(u)}function showAnn(item,voice){stopInterstitial();current=item;currentType='announcement';idle=false;$('#videoArea').classList.add('hidden');$('#announcementArea').classList.remove('hidden');$('#interstitialBadge').textContent='RÁDIO CAHK';$('#sourceBadge').textContent=item.type==='product'?'RECADO DO CAHK':item.type==='event'?'AGENDA CAHK':'RÁDIO CAHK';$('#title').textContent=item.title||'Rádio CAHK';$('#channel').textContent='';$('#announcementText').textContent=item.text||'';if(item.audio_url){interstitialAudio=new Audio(item.audio_url);interstitialAudio.onended=()=>next();interstitialAudio.onerror=()=>speak(item.text,voice);interstitialAudio.play().catch(()=>speak(item.text,voice))}else speak(item.text,voice)}function showCommunity(item){stopInterstitial();current=item;currentType='community_audio';idle=false;$('#videoArea').classList.add('hidden');$('#announcementArea').classList.remove('hidden');$('#interstitialBadge').textContent='🎙 ÁUDIO DA GALERA';$('#sourceBadge').textContent='A GALERA TÁ NO AR';$('#title').textContent=`Recado de ${item.display_name||'alguém do CAHK'}`;$('#channel').textContent=`${item.duration_seconds||''}${item.duration_seconds?' segundos':''}`;$('#announcementText').textContent='Recado da comunidade CAHK';interstitialAudio=new Audio(item.audio_url);interstitialAudio.onended=()=>{interstitialAudio=null;next()};interstitialAudio.onerror=()=>{interstitialAudio=null;$('#playerMsg').textContent='Não foi possível tocar este recado.';setTimeout(next,800)};interstitialAudio.play().catch(()=>{interstitialAudio=null;$('#playerMsg').textContent='O navegador bloqueou o áudio. Clique em iniciar novamente.';setTimeout(next,1500)})}
function restoreUnderlyingUI(){
  if(!current||!currentType){
    $('#videoArea').classList.add('hidden');$('#announcementArea').classList.remove('hidden');
    $('#interstitialBadge').textContent='RÁDIO CAHK';$('#sourceBadge').textContent='AGUARDANDO';$('#title').textContent='Preparando programação…';$('#channel').textContent='';$('#announcementText').textContent='';
    return;
  }
  if(currentType==='video'){
    $('#videoArea').classList.remove('hidden');$('#announcementArea').classList.add('hidden');
    $('#sourceBadge').textContent=current.source==='auto'?'PROGRAMAÇÃO AUTOMÁTICA':'PEDIDO';
    $('#title').textContent=current.title||'Música';$('#channel').textContent=current.channel||'';
  }else if(currentType==='announcement'){
    $('#videoArea').classList.add('hidden');$('#announcementArea').classList.remove('hidden');
    $('#interstitialBadge').textContent='RÁDIO CAHK';
    $('#sourceBadge').textContent=current.type==='product'?'RECADO DO CAHK':current.type==='event'?'AGENDA CAHK':'RÁDIO CAHK';
    $('#title').textContent=current.title||'Rádio CAHK';$('#channel').textContent='';$('#announcementText').textContent=current.text||'';
  }else if(currentType==='community_audio'){
    $('#videoArea').classList.add('hidden');$('#announcementArea').classList.remove('hidden');
    $('#interstitialBadge').textContent='🎙 ÁUDIO DA GALERA';$('#sourceBadge').textContent='A GALERA TÁ NO AR';
    $('#title').textContent=`Recado de ${current.display_name||'alguém do CAHK'}`;$('#channel').textContent=`${current.duration_seconds||''}${current.duration_seconds?' segundos':''}`;$('#announcementText').textContent='Recado da comunidade CAHK';
  }
}
async function checkScheduled(){
  if(!started||scheduledActive||scheduledPending||scheduleCheckLock)return;
  scheduleCheckLock=true;
  try{
    const j=await fn('radio-schedule-check',{action:'check',lookahead_seconds:2});
    if(j.type==='scheduled_audio'&&j.item)prepareScheduled(j.item);
  }catch(e){
    console.warn('Falha ao verificar horário marcado',e);
  }finally{scheduleCheckLock=false}
}
function prepareScheduled(item){
  if(scheduledActive||scheduledPending)return;
  scheduledPending=item;
  scheduledAudio=new Audio(item.audio_url);
  scheduledAudio.preload='auto';
  try{scheduledAudio.load()}catch{}
  const delay=Math.max(0,new Date(item.scheduled_for).getTime()-Date.now());
  scheduledTimer=setTimeout(()=>startScheduled(item),delay);
}
async function startScheduled(item){
  if(!scheduledPending||scheduledPending.id!==item.id)return;
  scheduledPending=null;scheduledActive=true;
  scheduledSnapshot={type:currentType,speechPaused:false};
  if(currentType==='video'&&yt){try{yt.pauseVideo()}catch{}}
  if(interstitialAudio&&!interstitialAudio.paused){try{interstitialAudio.pause()}catch{}}
  if(!interstitialAudio&&speechSynthesis.speaking){try{speechSynthesis.pause();scheduledSnapshot.speechPaused=true}catch{}}
  $('#videoArea').classList.add('hidden');$('#announcementArea').classList.remove('hidden');
  $('#interstitialBadge').textContent='⏰ HORÁRIO MARCADO';$('#sourceBadge').textContent='AGORA';
  $('#title').textContent=item.title||'Áudio agendado';$('#channel').textContent=`Programado para ${new Date(item.scheduled_for).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`;
  $('#announcementText').textContent='Áudio programado pela Rádio CAHK';
  $('#playerMsg').textContent='Reproduzindo no horário agendado.';
  const local=scheduledAudio;
  local.onended=()=>finishScheduled(item);
  local.onerror=async()=>{try{await fn('radio-schedule-check',{action:'release',id:item.id})}catch{};finishScheduled(item,true)};
  try{
    const p=local.play();
    fn('radio-schedule-check',{action:'started',id:item.id}).catch(()=>{});
    await p;
  }catch(e){
    try{await fn('radio-schedule-check',{action:'release',id:item.id})}catch{}
    finishScheduled(item,true);
  }
}
function finishScheduled(item,failed=false){
  if(scheduledAudio){try{scheduledAudio.pause();scheduledAudio.src=''}catch{}scheduledAudio=null}
  scheduledActive=false;scheduledTimer=null;
  restoreUnderlyingUI();
  $('#playerMsg').textContent=failed?'Não foi possível reproduzir o áudio agendado.':'Áudio agendado concluído.';
  const snap=scheduledSnapshot;scheduledSnapshot=null;
  if(currentType==='video'&&current&&yt){try{yt.playVideo()}catch{};setTimeout(()=>{$('#playerMsg').textContent=''},1200);return}
  if(interstitialAudio&&current){interstitialAudio.play().catch(()=>next());setTimeout(()=>{$('#playerMsg').textContent=''},1200);return}
  if(snap?.speechPaused&&speechSynthesis.paused){try{speechSynthesis.resume()}catch{};setTimeout(()=>{$('#playerMsg').textContent=''},1200);return}
  if(current){setTimeout(()=>{$('#playerMsg').textContent=''},1200);return}
  setTimeout(()=>next(),250);
}
setInterval(checkScheduled,750);
async function next(){if(!started||nextLock||scheduledActive||scheduledPending)return;nextLock=true;$('#playerMsg').textContent='Preparando próximo item…';try{const j=await fn('radio-next');if(j.type==='video')showVideo(j.item);else if(j.type==='announcement')showAnn(j.item,j.voice);else if(j.type==='community_audio')showCommunity(j.item);else{idle=true;current=null;currentType=null;$('#title').textContent='Aguardando programação';$('#channel').textContent='';$('#sourceBadge').textContent='EM ESPERA';$('#playerMsg').textContent=j.message||'Sem conteúdo disponível.';setTimeout(()=>{if(started&&idle)next()},15000)}qload();if(j.type!=='idle')$('#playerMsg').textContent=''}catch(e){idle=true;$('#playerMsg').textContent=e.message;setTimeout(()=>{if(started)next()},10000)}finally{nextLock=false}}async function finishVideo(){if(currentType!=='video'||!current)return next();try{await fn('queue-admin',{action:'finish',id:current.id})}catch(e){$('#playerMsg').textContent=e.message}current=null;currentType=null;setTimeout(next,250)}$('#start').onclick=async()=>{if(!token())return $('#startMsg').textContent='Digite o código administrativo.';localStorage.setItem('radioCahkAdmin',token());$('#startMsg').textContent='Validando…';started=true;try{const j=await fn('radio-next');$('#loginCard').classList.add('hidden');$('#station').classList.remove('hidden');if(j.type==='video')showVideo(j.item);else if(j.type==='announcement')showAnn(j.item,j.voice);else if(j.type==='community_audio')showCommunity(j.item);else{idle=true;$('#playerMsg').textContent=j.message||'';next()}qload()}catch(e){started=false;$('#startMsg').textContent=e.message}};$('#skip').onclick=async()=>{if(scheduledActive||scheduledPending){$('#playerMsg').textContent='Aguarde o áudio agendado.';return}stopInterstitial();if(currentType==='video'&&current){try{await fn('queue-admin',{action:'skip',id:current.id})}catch(e){$('#playerMsg').textContent=e.message}}current=null;currentType=null;next()};$('#clear').onclick=async()=>{if(!confirm('Remover todos os pedidos da fila?'))return;try{await fn('queue-admin',{action:'clear'});qload()}catch(e){$('#playerMsg').textContent=e.message}};$('#admin').onclick=()=>location.href='admin.html';const saved=localStorage.getItem('radioCahkAdmin');if(saved)$('#token').value=saved;sb.channel('radio-player').on('postgres_changes',{event:'*',schema:'public',table:'queue'},()=>{qload();if(started&&idle)next()}).subscribe();qload();
</script></body></html>
